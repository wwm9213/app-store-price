name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify backend and package JAR
        run: ./mvnw -B verify
      - name: Verify frontend rules
        run: node --test src/test/js/*.test.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: app-store-price-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
      - uses: docker/setup-buildx-action@v4
      - name: Build clean Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app-store-price:local
          cache-from: type=gha,scope=app-store-price
          cache-to: type=gha,mode=max,scope=app-store-price
      - name: Start container and verify HTTP
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('http://localhost:8080/api/v2/storefronts');
          assert.equal(response.status, 200);
          const {data} = await response.json();
          assert.equal(data.total, 175);
          assert.equal(data.mainstream.length, 14);
          const html = await (await fetch('http://localhost:8080/')).text();
          assert.ok(html.includes('searchableSelect'));
          assert.ok(html.includes('pageLoading'));
          JS
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Publish tested image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app-store-price
          cache-to: type=gha,mode=max,scope=app-store-price
      - name: Write image summary
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Published image: `%s@%s`\n\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'The image is ready to deploy. Publishing an image does not start a public website.\n' >> "$GITHUB_STEP_SUMMARY"
